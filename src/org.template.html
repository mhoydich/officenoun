    <style>
      .ou .org-clock { display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; padding: 10px 18px; border-radius: 999px; background: var(--ou-ink); color: var(--ou-bg); font-size: 15px; font-weight: 600; }
      .ou .org-clock::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; background: linear-gradient(currentColor, currentColor) 50% 15% / 2px 40% no-repeat; }

      /* one grouped list per department, cards generated by scripts/build.mjs */
      .ou .org-main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; align-items: start; }
      .ou .org-dept { border-radius: var(--ou-radius); background: var(--ou-card); overflow: hidden; }
      .ou .org-dept h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0; padding: 18px 18px 8px; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
      .ou .org-dept h2 span { color: var(--ou-muted); font-size: 13px; font-weight: 600; letter-spacing: 0; white-space: nowrap; }
      .ou .org-chain { list-style: none; margin: 0; padding: 0 6px 6px; }
      .ou .org-card { position: relative; display: flex; gap: 12px; align-items: center; padding: 10px 12px 10px 22px; }
      .ou .org-card + .org-card { border-top: 1px solid var(--ou-line); }
      /* the reporting line: each card hangs from the one above it */
      .ou .org-card::before { content: ""; position: absolute; left: 9px; top: 0; bottom: 0; width: 2px; background: var(--ou-line); }
      .ou .org-card:first-child::before { top: 50%; }
      .ou .org-card:last-child::before { bottom: 50%; }
      .ou .org-card:only-child::before { display: none; }
      .ou .org-card::after { content: ""; position: absolute; left: 6px; top: calc(50% - 4px); width: 8px; height: 8px; border-radius: 50%; background: var(--ou-soft); }
      .ou .org-card:first-child::after { background: var(--ou-warm); }
      .ou .org-card img { flex: 0 0 64px; width: 64px; height: 64px; border-radius: 14px; background: var(--ou-noun); image-rendering: pixelated; image-rendering: crisp-edges; }
      .ou .org-card div { min-width: 0; }
      .ou .org-card p { margin: 0; line-height: 1.3; }
      .ou .org-who { color: var(--ou-warm); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
      .ou .org-title { font-size: 16px; font-weight: 600; }
      .ou .org-traits, .ou .org-boss { color: var(--ou-muted); font-size: 13px; }
      .ou .org-boss { color: var(--ou-soft); }

      .ou .ou-foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 28px var(--ou-gutter) 48px; border-top: 1px solid var(--ou-line); color: var(--ou-muted); font-size: 13px; }
      .ou .ou-foot a { color: var(--ou-muted); }
    </style>
