<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#d5d7e1">
    <meta name="description" content="day {{DAY_NUMBER}} at the office. today's planned posts and the queued lots.">
    <title>Office Noun · day {{DAY_NUMBER}}</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Office Noun · today">
<meta property="og:description" content="what the office noun desk did today.">
<meta property="og:url" content="https://officenoun.xyz/today/">
<meta property="og:image" content="https://officenoun.xyz/card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://officenoun.xyz/card.png">
    <link rel="icon" href="../noun.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body class="today-page">
    <main>
      <header class="office">
        <h1 class="office-title">another day at the office</h1>
        <div class="portrait">
          <img class="noun" src="../today.svg" alt="{{HERO_ALT}}" width="320" height="320">
          <div class="desk" aria-hidden="true"></div>
        </div>
        <p class="day-count">Day {{DAY_NUMBER}} at the office.<span class="cursor" aria-hidden="true"></span></p>
        <p class="today-date"><time datetime="{{DATE_ISO}}">{{DATE_LABEL}}</time></p>
        <p class="trait-line">{{TRAIT_LINE}}</p>
      </header>

      <section class="today-block" aria-labelledby="h-desk">
        <div class="today-inner">
          <h2 class="gallery-title" id="h-desk">today's desk</h2>
{{DESK}}
        </div>
      </section>

      <section class="today-block" aria-labelledby="h-lots">
        <div class="today-inner">
          <h2 class="gallery-title" id="h-lots">the lots</h2>
          <p>{{LOTS_LINE}}</p>
          <p><a href="../org/index.html">see everyone on the org chart.</a></p>
        </div>
      </section>

      <section class="today-block" aria-labelledby="h-gifts">
        <div class="today-inner">
          <h2 class="gallery-title" id="h-gifts">gifts</h2>
          <p>{{GIFTS}}</p>
        </div>
      </section>
    </main>

    <footer>
      <a href="../../index.html">home</a>
      <span aria-hidden="true">·</span>
      <a href="../org/index.html">org chart</a>
      <span aria-hidden="true">·</span>
      <a href="../dao/index.html">the office dao</a>{{NAV_EXTRA}}
    </footer>
    <script>
      (function () {
        var list = document.querySelector("[data-plan]");
        if (!list) return;
        var zone = list.getAttribute("data-time-zone");
        var built = list.getAttribute("data-date");

        function now() {
          var parts = new Intl.DateTimeFormat("en-CA", {
            timeZone: zone, year: "numeric", month: "2-digit", day: "2-digit",
            hour: "2-digit", minute: "2-digit", hourCycle: "h23"
          }).formatToParts(new Date());
          var got = {};
          parts.forEach(function (part) { got[part.type] = part.value; });
          return { date: got.year + "-" + got.month + "-" + got.day, minutes: Number(got.hour) * 60 + Number(got.minute) };
        }

        function mark() {
          var clock;
          try { clock = now(); } catch (error) { return; }
          // A page left open (or cached) from another day says nothing about the clock.
          var live = clock.date === built;
          var found = false;
          Array.prototype.forEach.call(list.children, function (item) {
            var tag = item.querySelector(".mark");
            item.className = "";
            tag.textContent = "";
            if (!live) return;
            if (Number(item.getAttribute("data-minutes")) <= clock.minutes) {
              item.className = "done";
              tag.textContent = "✓";
            } else if (!found) {
              found = true;
              item.className = "next";
              tag.textContent = "next";
            }
          });
        }

        mark();
        setInterval(mark, 60000);
      })();
    </script>
  </body>
</html>
