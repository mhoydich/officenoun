<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#d5d7e1">
    <meta name="description" content="A Noun keeps a daybook at the office.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Office Noun">
    <meta property="og:description" content="A Noun keeps a daybook at the office.">
    <meta property="og:url" content="https://officenoun.xyz/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Office Noun">
    <meta name="twitter:description" content="A Noun keeps a daybook at the office.">
    <title>Office Noun</title>
    <link rel="icon" href="{{ASSET_PREFIX}}/noun.svg" type="image/svg+xml">
    <link rel="stylesheet" href="{{ASSET_PREFIX}}/styles.css">
  </head>
  <body>
    <main>
      <header class="office">
        <div class="portrait">
          <img
            class="noun"
            src="{{ASSET_PREFIX}}/nouns/stapler.svg"
            alt="An office Noun with a stapler head and black tie, sitting at a desk."
            width="320"
            height="320"
            data-office-noun
          >
          <div class="desk" aria-hidden="true"></div>
        </div>
        <p class="day-count" data-day-count data-start-date="{{START_DATE}}" data-time-zone="{{TIME_ZONE}}">Day {{DAY_NUMBER}} at the office.</p>
      </header>

{{DAYBOOK}}
    </main>

    <footer>
      <a href="{{REPO_URL}}">CC0 — copy the format.</a>
      <span aria-hidden="true">·</span>
      <a href="{{X_URL}}">x.com/officenoun</a>
    </footer>

    <script>
      (() => {
        const line = document.querySelector("[data-day-count]");
        const start = line.dataset.startDate.split("-").map(Number);
        const parts = new Intl.DateTimeFormat("en-CA", {
          day: "2-digit",
          month: "2-digit",
          timeZone: line.dataset.timeZone,
          year: "numeric"
        }).formatToParts(new Date());
        const part = (type) => Number(parts.find((item) => item.type === type).value);
        const todayUtc = Date.UTC(part("year"), part("month") - 1, part("day"));
        const startUtc = Date.UTC(start[0], start[1] - 1, start[2]);
        const day = Math.max(1, Math.floor((todayUtc - startUtc) / 86400000) + 1);
        line.textContent = `Day ${day} at the office.`;

        const noun = document.querySelector("[data-office-noun]");
        const roster = [
          ["stapler", "a stapler head and black tie"],
          ["calculator", "a calculator head and black tie"],
          ["calendar", "a calendar head and office ID"],
          ["coffee", "a coffee bean head and red tie"],
          ["phone", "a cordless phone head and black shirt"],
          ["mailbox", "a mailbox head and purple tie"],
          ["mouse", "a computer mouse head and black tie"],
          ["mug", "a coffee mug head and pencil pocket"],
          ["pencil", "a pencil head and office ID"],
          ["laptop", "a laptop head and pencil pocket"]
        ];
        const [name, description] = roster[(day - 1) % roster.length];
        noun.src = `{{ASSET_PREFIX}}/nouns/${name}.svg`;
        noun.alt = `An office Noun with ${description}, sitting at a desk.`;
      })();
    </script>
  </body>
</html>
